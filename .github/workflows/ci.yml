name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360  # Allow time for MLIR build on cache miss
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          else
            brew install cmake ninja
          fi

      - name: Create toolchain directory
        run: |
          sudo mkdir -p /opt/mlir-toolchain
          sudo chown -R $USER /opt/mlir-toolchain

      - name: Cache MLIR toolchain
        id: cache-mlir
        uses: actions/cache@v4
        with:
          path: /opt/mlir-toolchain
          key: ${{ runner.os }}-mlir-llvm-19.1.7-python-${{ matrix.python-version }}

      - name: Build MLIR toolchain
        if: steps.cache-mlir.outputs.cache-hit != 'true'
        run: |
          # Clone LLVM (shallow clone for speed)
          git clone --depth 1 --branch llvmorg-19.1.7 https://github.com/llvm/llvm-project.git
          cd llvm-project

          # Configure minimal MLIR build
          cmake -G Ninja llvm \
            -B build \
            -DCMAKE_INSTALL_PREFIX=/opt/mlir-toolchain \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD="Native" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DPython3_EXECUTABLE=$(which python3) \
            -DBUILD_SHARED_LIBS=OFF

          # Build essential targets only
          cmake --build build --target mlir-opt mlir-translate MLIRPythonModules

          # Install
          cmake --install build

      - name: Verify MLIR installation
        run: |
          ls -la /opt/mlir-toolchain/bin/
          /opt/mlir-toolchain/bin/mlir-opt --version
          ls -la /opt/mlir-toolchain/python_packages/ || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          # Use MLIR_INSTALLATIONS to auto-configure paths
          export MLIR_INSTALLATIONS=/opt/mlir-toolchain
          pytest --cov=src/mlir_mcp_server --cov-report=xml --cov-report=term -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        if: matrix.os == 'ubuntu-latest'
